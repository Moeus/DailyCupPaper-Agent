[project]
name = "dailycuppaper-agents"
version = "0.1.0"
description = ""
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.3.10",
    "langchain-core>=1.3.10",
    "langchain-openai>=1.6.6",
    "langgraph>=1.0.0",
    "langgraph-cli[inmem]>=0.4.10",
    "langgraph-sdk>=0.2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "pytest>=9.0.3",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = ["academic_research_agent", "translation_agent", "agent_runtime", "tools"]
source-include = [
    "langgraph.json",
    "Makefile",
    "tests/**",
]
